<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for every app icon size: `npx tauri icon src-tauri/icons/app-icon.svg` from ui/.
       Original artwork: a jog wheel on a dark panel, on the macOS icon grid (824 px body). -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c" />
      <stop offset="1" stop-color="#0c0c0e" />
    </linearGradient>
    <radialGradient id="platter" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2c2c33" />
      <stop offset="1" stop-color="#121216" />
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc2ff" />
      <stop offset="1" stop-color="#1f7fd6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#panel)" filter="url(#shadow)" />
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#3a3a42" stroke-width="3" />

  <!-- Lit ring, as when a deck is playing. -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#2fa8ff" stroke-width="26" opacity="0.55" filter="url(#glow)" />
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="22" />

  <!-- Platter with grip dots and the position marker. -->
  <circle cx="512" cy="512" r="276" fill="url(#platter)" />
  <g fill="#3a3a44">
    <circle cx="512" cy="268" r="7" /><circle cx="756" cy="512" r="7" /><circle cx="512" cy="756" r="7" /><circle cx="268" cy="512" r="7" />
    <circle cx="684.5" cy="339.5" r="7" /><circle cx="684.5" cy="684.5" r="7" /><circle cx="339.5" cy="684.5" r="7" /><circle cx="339.5" cy="339.5" r="7" />
  </g>
  <rect x="497" y="262" width="30" height="92" rx="15" fill="#f2f2f4" />

  <!-- Hub with a play triangle. -->
  <circle cx="512" cy="512" r="112" fill="#08080a" stroke="#34343c" stroke-width="6" />
  <path d="M482 452 L566 512 L482 572 Z" fill="#36d26a" stroke="#36d26a" stroke-width="10" stroke-linejoin="round" />
</svg>
